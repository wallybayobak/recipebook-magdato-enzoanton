{% extends 'base.html' %}

{% block title %}Recipe List{% endblock %}

{% block content %}
  <h1>All Recipes</h1>
  <ul>
    {% for recipe in object_list %}
      <li>
        <a href="{% url 'ledger:recipe-detail' recipe.pk %}">
          <strong>{{ recipe.name }}</strong>
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
