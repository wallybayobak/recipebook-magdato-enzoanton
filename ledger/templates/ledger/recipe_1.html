{% extends 'base.html' %}

{% block title %}{{ name }}{% endblock %}

{% block content %}
  <h2>{{ name }}</h2>
  <ul>
    {% for ing in ingredients %}
      <li>{{ ing.name }}: {{ ing.quantity }}</li>
    {% endfor %}
  </ul>
  <p><a href="{% url 'recipe_list' %}">← Back to all recipes</a></p>
{% endblock %}
