{% extends 'base.html' %}

{% block page_title %}Login{% endblock %}

{% block content %}
  {% if form.errors %}
    <div class="errors">
      {% for field in form %}
        {% for error in field.errors %}
          <p>{{ error }}</p>
        {% endfor %}
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>

  <p><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
{% endblock %}
