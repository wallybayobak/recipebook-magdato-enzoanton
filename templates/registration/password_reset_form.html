{% extends 'base.html' %}

{% block page_title %}Password Reset{% endblock %}

{% block content %}
  <h2>Reset your password</h2>
  {% if form.errors %}
    <div class="errors">
      {% for field in form %}
        {% for error in field.errors %}
          <p>{{ error }}</p>
        {% endfor %}
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Request Password Reset Link</button>
  </form>
{% endblock %}
